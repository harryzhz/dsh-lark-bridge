name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install, build, typecheck, and test
        run: |
          pnpm install
          pnpm build
          pnpm typecheck
          pnpm test

      - name: Pack plugin tarball and checksums
        run: |
          node scripts/pack-bundle.mjs --out-dir .local/releases
          cd .local/releases
          sha256sum *.tgz > SHA256SUMS.txt
          ls -la

      - name: Publish to npm (when NPM_TOKEN secret is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured; skipping npm publish."
            exit 0
          fi
          npm publish --access public

      - name: Publish GitHub Release with .tgz asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            .local/releases/*.tgz
            .local/releases/SHA256SUMS.txt
